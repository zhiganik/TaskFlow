server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy all /api/* to the API container — same origin, no CORS needed.
    # ^~ prevents regex locations (e.g. the static asset cache rule) from matching
    # API URLs that happen to end in .jpg, .png, etc. (e.g. /api/v1/me/avatar/uuid.jpg).
    location ^~ /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25M;
    }

    # Vite hashes JS/CSS filenames — safe to cache for 1 year
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router — unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
