server {
    listen 80;
    server_name localhost;

    # Docker's embedded DNS — re-resolve notification-worker every 30s so nginx
    # picks up all replica IPs instead of caching the one that was up at startup.
    resolver 127.0.0.11 valid=30s ipv6=off;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy all /api/* to the API container — same origin, no CORS needed.
    # ^~ prevents regex locations (e.g. the static asset cache rule) from matching
    # API URLs that happen to end in .jpg, .png, etc. (e.g. /api/v1/me/avatar/uuid.jpg).
    location ^~ /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25M;
    }

    # SignalR WebSocket hub — must upgrade connection for long-lived WS
    location ^~ /hubs/ {
        # Variable forces per-request DNS lookup via the resolver above.
        # Docker DNS returns all replica IPs in round-robin order.
        set $notification_worker "notification-worker:8080";
        proxy_pass http://$notification_worker;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Vite hashes JS/CSS filenames — safe to cache for 1 year
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router — unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
